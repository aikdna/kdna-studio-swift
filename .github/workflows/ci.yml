name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Responsibility naming gate
        run: scripts/check-responsibility-names.sh working-tree
      - name: Source surface and historical integrity
        run: |
          python3 scripts/check-source-surface.py --swiftpm
          python3 scripts/test_source_surface.py
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build
      - name: Build generic iOS target
        run: >-
          xcodebuild -quiet -scheme kdna-studio-swift
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/kdna-studio-swift-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: swift test
      - name: Release build and tests
        run: |
          swift build -c release
          swift test -c release
      - name: Public consumer
        run: |
          python3 scripts/check-public-consumer.py --configuration debug
          python3 scripts/check-public-consumer.py --configuration release
      - name: Release archive naming gate
        run: scripts/check-responsibility-names.sh archive
